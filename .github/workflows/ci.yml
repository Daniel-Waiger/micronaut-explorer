name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Run tests
        run: python -m pytest -q tests/test_single_file_build.py tests/test_kb_json_valid.py tests/test_regex_conformance.py

  web-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No `npm install` -- web/ is a deliberately zero-dependency, no
      # node_modules ES-module project (docs/plans/planner-web.md). The glob
      # is required: bare `node --test web/tests/` fails with
      # MODULE_NOT_FOUND on node v22.
      - name: Run web/ tests
        run: node --test web/tests/*.test.js
