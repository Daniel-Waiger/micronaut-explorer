name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and dev tools
        run: python -m pip install -e .[test]

      - name: Ruff
        run: python -m ruff check src tests app_streamlit.py run_main.py

      - name: Black --check
        run: python -m black --check --line-length 100 src tests app_streamlit.py run_main.py

      - name: Mypy (advisory)
        continue-on-error: true
        run: python -m mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test dependencies
        run: python -m pip install -e .[test]

      - name: Run tests
        run: python -m pytest -q -m "not integration"

  web-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm install` -- web/ is a deliberately zero-dependency, no
      # node_modules ES-module project (docs/plans/planner-web.md). The glob
      # is required: bare `node --test web/tests/` fails with
      # MODULE_NOT_FOUND on node v22.
      - name: Run web/ tests
        run: node --test web/tests/*.test.js

  integration:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test dependencies
        run: python -m pip install -e .[test]

      - name: Run integration tests
        run: python -m pytest -q -m integration
