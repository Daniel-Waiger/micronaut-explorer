name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      - name: Run tests
        run: python -m pytest -q tests/test_single_file_build.py tests/test_kb_json_valid.py tests/test_regex_conformance.py tests/test_browser_cdp.py

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # ubuntu-latest ships Chrome, but this project is stdlib-only with no
      # playwright/puppeteer browser-download step, so a runner image that
      # stopped shipping Chrome would make tests/conftest.py's fixtures SKIP
      # the whole e2e suite -- and an all-skipped pytest run exits 0, which
      # branch protection cannot tell apart from a real pass. This step FAILS
      # the job instead: the one job whose entire purpose is driving a browser
      # must never go green having driven nothing. (Locally, skipping is still
      # the right behaviour and remains the default -- see conftest.py.)
      - name: Require a browser in the e2e job
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'tools')
          from browser_cdp import find_chrome
          found = find_chrome()
          print(f'find_chrome() -> {found!r}')
          if not found:
              sys.exit('No Chrome/Chromium on this runner: the e2e job would skip every test and still exit 0. Install a browser or set CHROME_BIN.')
          "

      - name: Run the browser e2e suite
        run: python -m pytest -q tests/test_e2e_flows.py

  web-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No `npm install` -- web/ is a deliberately zero-dependency, no
      # node_modules ES-module project (docs/plans/planner-web.md). The glob
      # is required: bare `node --test web/tests/` fails with
      # MODULE_NOT_FOUND on node v22.
      - name: Run web/ tests
        run: node --test web/tests/*.test.js
