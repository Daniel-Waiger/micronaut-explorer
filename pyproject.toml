[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microscopy-naming-assistant"
version = "0.1.0"
description = "Metadata-aware microscopy file naming assistant with optional local LLM suggestions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "bioio>=1.1.0",
  "bioio-bioformats>=1.0.0",
  "requests>=2.32.0",
  "streamlit>=1.37.0"
]

[project.scripts]
mna = "microscopy_naming_assistant.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=9.1.0",
  "pytest-timeout>=2.3.0",
  "ruff>=0.6.0",
  "black>=24.0.0",
  "mypy>=1.10.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
microscopy_naming_assistant = ["py.typed"]

[tool.pytest.ini_options]
timeout = 60
markers = [
  "integration: needs Java/real readers"
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# app_streamlit.py deliberately imports after a sys.path fixup and after
# setting STREAMLIT_SERVER_MAX_UPLOAD_SIZE/MAX_MESSAGE_SIZE env vars (both
# must run before their dependent imports), so E402 is expected here.
"app_streamlit.py" = ["E402"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
