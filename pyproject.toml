[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micronaut-explorer"
version = "0.1.0"
description = "Micronaut - metadata-aware microscopy file naming assistant with optional local LLM suggestions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Daniel Waiger"}]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "bioio>=1.1.0",
  # native readers preferred; bioio-bioformats is the Java fallback
  "bioio-ome-tiff>=1.0.0",
  "bioio-tifffile>=1.0.0",
  "bioio-lif>=1.0.0",
  "bioio-nd2>=1.0.0",
  "bioio-bioformats>=1.0.0",
  "requests>=2.32.0",
  "streamlit>=1.37.0"
]

[project.scripts]
mna = "microscopy_naming_assistant.cli:main"

[project.optional-dependencies]
# bioio-czi (native CZI reader) requires building aicspylibczi/pylibczirw from
# source on platforms without prebuilt wheels (needs CMake + a C++ toolchain);
# install manually where a build toolchain is available. Without it, .czi
# files still work via the bioio-bioformats (Java) fallback.
czi = [
  "bioio-czi>=1.0.0"
]
test = [
  "pytest>=9.1.0",
  "pytest-timeout>=2.3.0",
  "ruff>=0.6.0",
  "black>=24.0.0",
  "mypy>=1.10.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
microscopy_naming_assistant = ["py.typed"]

[tool.pytest.ini_options]
timeout = 60
markers = [
  "integration: needs Java/real readers",
  "smoke: streamlit AppTest UI smoke tests"
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# app_streamlit.py deliberately imports after a sys.path fixup and after
# setting STREAMLIT_SERVER_MAX_UPLOAD_SIZE/MAX_MESSAGE_SIZE env vars (both
# must run before their dependent imports), so E402 is expected here.
"app_streamlit.py" = ["E402"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
