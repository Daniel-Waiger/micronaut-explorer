<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Micronaut Planner</title>
<!--
  No favicon was ever declared, so browsers fell back to their own default
  tab/bookmark placeholder (a plain circle in most). This is an inline SVG
  data URI rather than a separate favicon.svg file: the build only substitutes
  the three BUILD: marker regions above and copies everything else in this
  file verbatim (see tools/build_single_file.py's `_replace_marker` calls), so
  a second file would need its own build-step wiring to reach dist/ and would
  break file:// use, where an app can only ever open the one HTML file a user
  downloaded. A data URI needs neither and works identically in dev, the
  built artifact, and file://.

  The mark matches .brand-mark in styles/app.css exactly: the same
  135deg #0a707c->#14a3b0 gradient tile and the same `microscope` glyph from
  src/ui/icons.js, redrawn here since a favicon can't reference either at
  render time -- so a change to that icon or gradient should be mirrored here.
-->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%230a707c'/%3E%3Cstop offset='1' stop-color='%2314a3b0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cg transform='translate(6,6) scale(0.8333)' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 18h8'/%3E%3Cpath d='M3 22h18'/%3E%3Cpath d='M14 22a7 7 0 0 0 0-14h-1'/%3E%3Cpath d='M9 14h2M9 8h2'/%3E%3Cpath d='M10 6v4M5 2l3 3M7 4 4 7'/%3E%3C/g%3E%3C/svg%3E" />
<!-- BUILD:STYLE -->
<link rel="stylesheet" href="./styles/app.css" />
<!-- /BUILD:STYLE -->
</head>
<body>
<!-- R5-12: skip link, the first focusable element on every route; its
     target #main-content is the <main> ui/shell.js renders. -->
<a href="#main-content" class="skip-link">Skip to content</a>
<div id="app"></div>
<!-- BUILD:KB -->
<script src="./kb.dev.js"></script>
<!-- /BUILD:KB -->
<!-- BUILD:SCRIPT -->
<script type="module" src="./src/main.js"></script>
<!-- /BUILD:SCRIPT -->
</body>
</html>
